name: setup-js
description: setup js

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.1
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Global Packages Install
      shell: bash
      run: pnpm add -g @antfu/ni
    - name: Packages Install
      shell: bash
      run: ni
